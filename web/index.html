<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smiles Treats admin dashboard for managing products, orders and customers.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smiles Treats">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <!-- Link preview (WhatsApp, iMessage, etc.) -->
  <meta property="og:title" content="Smiles Treats">
  <meta property="og:description" content="Smiles Treats admin dashboard for managing products, orders and customers.">
  <meta property="og:image" content="https://app.smilesinstock.com/icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smiles Treats</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #fff; font-family: sans-serif; color: #759676;
    }
    #splash .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid #e3ebe3; border-top-color: #759676;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown while main.dart.js / CanvasKit download; removed on first Flutter frame. -->
  <div id="splash"><div class="spinner"></div><div>Smiles Treats</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
